<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ projeto.nome }} — VAGALUME90 Matrix</title>
<style>
:root{--bg:#07070a;--blue:#4fa3ff;--gold:#f5c030;--muted:#aeb8c6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif;padding:28px 18px 80px}.wrap{max-width:900px;margin:auto}.back{color:var(--gold);text-decoration:none}.hero,.panel{margin-top:22px;padding:24px;border:1px solid rgba(79,163,255,.28);border-radius:14px;background:rgba(79,163,255,.05)}h1{color:var(--blue);margin:0 0 8px}h2{color:var(--gold);font-size:1.15rem}.meta{color:var(--muted);font-family:monospace;font-size:.85rem}.file{border-top:1px solid rgba(255,255,255,.12);padding:14px 0}.file h3{color:var(--blue);margin:0 0 8px}pre{white-space:pre-wrap;overflow:auto;background:#020305;padding:14px;border-radius:8px;color:#d9e5f2}.commit{padding:10px 0;border-bottom:1px solid rgba(255,255,255,.1)}.commit strong{color:var(--blue)}.commit small{display:block;color:var(--muted);margin-top:4px}.feedback{color:var(--muted)}
</style></head>
<body><main class="wrap"><a class="back" href="/mundo/matrix">← Voltar à Matrix</a><section class="hero"><h1>{{ projeto.nome }}</h1><p>{{ projeto.descricao or 'Sem descrição.' }}</p><div class="meta">PROJETO PÚBLICO · MATRIX · {{ projeto.estado }}</div></section><section class="panel"><h2>Ficheiros</h2><div id="files" class="feedback">A carregar...</div></section><section class="panel"><h2>Histórico Git</h2><div id="commits" class="feedback">A carregar...</div></section></main>
<script>
const id={{ project_id|tojson }};
function message(target,text){const p=document.createElement('p');p.className='feedback';p.textContent=text;target.replaceChildren(p)}
async function load(){const files=document.getElementById('files'),commits=document.getElementById('commits');try{const [fr,cr]=await Promise.all([fetch(`/api/matrix/projetos/${encodeURIComponent(id)}/ficheiros`),fetch(`/api/matrix/projetos/${encodeURIComponent(id)}/commits?limite=50&offset=0`)]);const fd=await fr.json(),cd=await cr.json();if(!fr.ok||!fd.success)throw new Error(fd.error||'Não foi possível carregar ficheiros.');files.replaceChildren();if(!fd.ficheiros.length)message(files,'Ainda não existem ficheiros.');fd.ficheiros.forEach(file=>{const article=document.createElement('article');article.className='file';const h=document.createElement('h3');h.textContent=file.nome;const pre=document.createElement('pre');pre.textContent=file.conteudo;article.append(h,pre);files.appendChild(article)});if(!cr.ok||!cd.success)throw new Error(cd.error||'Não foi possível carregar o histórico.');commits.replaceChildren();if(!cd.commits.length)message(commits,'Ainda não existem commits.');cd.commits.forEach(commit=>{const item=document.createElement('div');item.className='commit';const strong=document.createElement('strong');strong.textContent=`${commit.sha.slice(0,8)} · ${commit.mensagem}`;const small=document.createElement('small');small.textContent=`${commit.autor} · ${new Date(commit.data).toLocaleString('pt-PT')}`;item.append(strong,small);commits.appendChild(item)})}catch(error){message(files,error.message);message(commits,'Não foi possível carregar o histórico.')}}load();
</script></body></html>
