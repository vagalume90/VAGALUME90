<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VAGALUME90 | Central de Comando</title>

<style>
:root {
    --bg: #080811;
    --card: #121222;
    --orange: #ff9d00;
    --purple: #7000ff;
    --pink: #ff1493;
    --text: #f5f5ff;
    --muted: #9999b5;
    --border: rgba(255,255,255,.09);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: Arial, sans-serif;
    min-height: 100vh;
}

header {
    padding: 18px 5%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
    background: #0d0d19;
    position: sticky;
    top: 0;
    z-index: 10;
}

.logo {
    color: var(--orange);
    font-weight: 900;
    font-size: 20px;
    letter-spacing: 2px;
}

.logo span {
    color: white;
}

.status {
    font-size: 11px;
    color: #39ff9b;
    margin-top: 5px;
}

button {
    cursor: pointer;
    border: none;
    border-radius: 8px;
    padding: 11px 16px;
    font-weight: bold;
}

.logout {
    background: #28121e;
    color: #ff6c9d;
    border: 1px solid #64223f;
}

main {
    width: 92%;
    max-width: 1200px;
    margin: 35px auto;
}

.welcome {
    background: linear-gradient(120deg, #201044, #111126 65%, #26152c);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 30px;
    margin-bottom: 25px;
}

.welcome small {
    color: var(--orange);
    letter-spacing: 2px;
    font-weight: bold;
}

.welcome h1 {
    margin: 15px 0 8px;
    font-size: clamp(25px, 5vw, 38px);
}

.welcome p {
    color: var(--muted);
    line-height: 1.6;
}

.identity {
    display: inline-block;
    margin-top: 18px;
    background: #ffffff12;
    padding: 9px 14px;
    border-radius: 8px;
    color: var(--orange);
    font-size: 13px;
}

.section-title {
    margin: 35px 0 17px;
    font-size: 19px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
}

.stat {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 20px;
    border-radius: 13px;
}

.stat small {
    color: var(--muted);
}

.stat h2 {
    margin-top: 12px;
    color: var(--orange);
    font-size: 23px;
}

.portals {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
}

.portal {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px;
    transition: .2s;
}

.portal:hover {
    transform: translateY(-4px);
    border-color: var(--purple);
}

.portal .icon {
    font-size: 30px;
}

.portal h3 {
    margin: 13px 0 8px;
}

.portal p {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.5;
}

.portal a {
    display: inline-block;
    margin-top: 17px;
    color: var(--orange);
    text-decoration: none;
    font-weight: bold;
    font-size: 13px;
}

.persy {
    margin-top: 30px;
    padding: 25px;
    border-radius: 15px;
    background: linear-gradient(110deg, #271044, #111126);
    border: 1px solid #7000ff55;
}

.persy h2 {
    color: #d1a6ff;
    margin-bottom: 10px;
}

.persy p {
    color: var(--muted);
    line-height: 1.6;
}

.persy a {
    display: inline-block;
    margin-top: 15px;
    color: var(--orange);
    text-decoration: none;
    font-weight: bold;
}

footer {
    text-align: center;
    padding: 30px;
    color: #666680;
    font-size: 12px;
}

.loading {
    text-align: center;
    padding: 50px;
    color: var(--orange);
}

@media(max-width: 750px) {
    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .portals {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media(max-width: 450px) {
    .portals {
        grid-template-columns: 1fr;
    }

    .welcome {
        padding: 22px;
    }

    header {
        padding: 15px 4%;
    }
}
</style>
</head>

<body>

<header>
    <div>
        <div class="logo">☥ VAGALUME<span>90</span></div>
        <div class="status">● CENTRAL DE COMANDO ONLINE</div>
    </div>

    <button class="logout" onclick="terminarSessao()">
        Sair
    </button>
</header>

<main id="conteudo">

    <div class="loading">
        A estabelecer ligação com a identidade VG90...
    </div>

</main>

<footer>
    VAGALUME90 © 2026
    <br><br>
    Ubuntu: Sou porque somos.
</footer>

<script>

const API = '';

async function carregarPainel() {

    try {

        const resposta = await fetch(
            API + '/api/auth/me',
            {
                method: 'GET',
                credentials: 'include'
            }
        );

        if (!resposta.ok) {

            window.location.replace('/');

            return;
        }

        const dados = await resposta.json();

        if (!dados.success || !dados.identity) {

            window.location.replace('/');

            return;
        }

        const user = dados.identity;

        const nome = user.nome || 'Utilizador VG90';
        const uid = user.uid || 'Não disponível';
        const nivel = user.combate?.nivel ?? 1;
        const xp = user.combate?.xp ?? 0;
        const carteira = user.carteira_kwanzas ?? 0;
        const status = user.status_sistema || 'ATIVO';

        document.getElementById('conteudo').innerHTML = `

            <section class="welcome">

                <small>IDENTIDADE VG90 RECONHECIDA</small>

                <h1>Olá, ${escapar(nome)} 👋</h1>

                <p>
                    Bem-vindo à Central de Comando.
                    O teu futuro tecnológico começa aqui.
                </p>

                <div class="identity">
                    IDENTIDADE: ${escapar(uid)}
                </div>

            </section>

            <h2 class="section-title">
                📊 O teu estado no ecossistema
            </h2>

            <section class="stats">

                <div class="stat">
                    <small>Identidade</small>
                    <h2>ATIVA</h2>
                </div>

                <div class="stat">
                    <small>Nível</small>
                    <h2>${nivel}</h2>
                </div>

                <div class="stat">
                    <small>Experiência XP</small>
                    <h2>${xp}</h2>
                </div>

                <div class="stat">
                    <small>Carteira (Kz)</small>
                    <h2>${Number(carteira).toLocaleString('pt-PT')}</h2>
                </div>

            </section>

            <h2 class="section-title">
                🌍 Portais do Vagalume90
            </h2>

            <section class="portals">

                <article class="portal">
                    <div class="icon">🛒</div>
                    <h3>Mercado</h3>
                    <p>Compra, venda e oportunidades digitais.</p>
                    <a href="/modulo/mercado">ACEDER →</a>
                </article>

                <article class="portal">
                    <div class="icon">🎓</div>
                    <h3>Academy</h3>
                    <p>Aprendizagem, cursos e livros.</p>
                    <a href="https://vg90-academy.onrender.com/">
                        ACEDER →
                    </a>
                </article>

                <article class="portal">
                    <div class="icon">🤝</div>
                    <h3>Afiliados</h3>
                    <p>Partilha oportunidades e ganha comissões.</p>
                    <a href="#">EM PREPARAÇÃO</a>
                </article>

                <article class="portal">
                    <div class="icon">🤖</div>
                    <h3>IA PRO</h3>
                    <p>Inteligência artificial e ferramentas digitais.</p>
                    <a href="#">EM PREPARAÇÃO</a>
                </article>

                <article class="portal">
                    <div class="icon">🎬</div>
                    <h3>Estúdio Criativo</h3>
                    <p>Criação de áudio, vídeo e conteúdos.</p>
                    <a href="#">EM PREPARAÇÃO</a>
                </article>

                <article class="portal">
                    <div class="icon">🌐</div>
                    <h3>Internet Rápida</h3>
                    <p>Soluções digitais leves e económicas.</p>
                    <a href="#">EM PREPARAÇÃO</a>
                </article>

            </section>

            <section class="persy">

                <h2>☥ PERSY — Inteligência Central</h2>

                <p>
                    O teu assistente inteligente do ecossistema VG90.
                    Consulta, aprende e recebe orientação para
                    desenvolver os teus projetos.
                </p>

                <a href="https://persy-ai.onrender.com/">
                    CONVERSAR COM PERSY →
                </a>

            </section>

            <h2 class="section-title">
                👤 A tua identidade
            </h2>

            <section class="stat">

                <p><small>Nome:</small> ${escapar(nome)}</p>
                <br>

                <p><small>UID:</small> ${escapar(uid)}</p>
                <br>

                <p><small>Email:</small> ${escapar(user.email || 'Não disponível')}</p>
                <br>

                <p><small>Telefone:</small> ${escapar(user.telefone || 'Não disponível')}</p>
                <br>

                <p><small>Estado:</small> ${escapar(status)}</p>

            </section>

        `;

    } catch (erro) {

        document.getElementById('conteudo').innerHTML = `
            <div class="loading">
                Não foi possível carregar o painel.
                <br><br>
                Verifica a ligação ao Core e tenta novamente.
                <br><br>
                <button onclick="carregarPainel()">
                    TENTAR NOVAMENTE
                </button>
            </div>
        `;

        console.error(erro);

    }

}


function escapar(valor) {

    return String(valor).replace(/[&<>"']/g, function(c) {

        return {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'

        }[c];

    });

}


async function terminarSessao() {

    try {

        await fetch('/api/auth/logout', {

            method: 'POST',

            credentials: 'include'

        });

    } finally {

        window.location.replace('/');

    }

}


carregarPainel();

</script>

</body>
</html>
