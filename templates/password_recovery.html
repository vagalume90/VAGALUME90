<!doctype html>
<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recuperar palavra-passe — VAGALUME90</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07070a;color:#fff;font-family:Arial,sans-serif}.card{width:min(430px,calc(100% - 32px));padding:28px;background:#11131a;border:1px solid #315b8c;border-radius:14px}h1{color:#4fa3ff}label{display:block;margin:15px 0 6px}input{width:100%;box-sizing:border-box;padding:12px;border-radius:7px;border:1px solid #315b8c;background:#080b10;color:#fff}button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:7px;background:#4fa3ff;color:#07070a;font-weight:700;cursor:pointer}.feedback{min-height:30px;margin-top:14px;color:#ff9aa7}.back{display:block;margin-top:18px;color:#f5c030;text-align:center;text-decoration:none}</style></head><body><main class="card">{% if modo == 'pedido' %}<h1>Recuperar acesso</h1><p>Indica o email da tua conta. Se existir, receberás um link temporário.</p><form id="recovery-form"><label>Email</label><input id="email" type="email" required autocomplete="email"><button>ENVIAR LINK</button></form>{% else %}<h1>Nova palavra-passe</h1><p>Este link é temporário e só pode ser usado uma vez.</p><form id="recovery-form"><label>Nova palavra-passe</label><input id="new" type="password" required minlength="8" autocomplete="new-password"><label>Confirmar palavra-passe</label><input id="confirm" type="password" required minlength="8" autocomplete="new-password"><button>REDEFINIR</button></form>{% endif %}<div class="feedback" id="feedback"></div><a class="back" href="/login">Voltar ao login</a></main><script>document.getElementById('recovery-form').addEventListener('submit',async(e)=>{e.preventDefault();const f=document.getElementById('feedback');const reset={{ 'false' if modo == 'pedido' else 'true' }};const body=reset?{password_nova:document.getElementById('new').value,password_confirmacao:document.getElementById('confirm').value}:{email:document.getElementById('email').value.trim()};const url=reset?window.location.pathname:'/esqueci-password';try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.error||'Não foi possível concluir.');f.style.color='#7dffb2';f.textContent=d.mensagem;if(reset)e.target.reset()}catch(err){f.textContent=err.message}});</script></body></html>
