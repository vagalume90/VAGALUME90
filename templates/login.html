<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vagalume90 - Login do Ecossistema</title>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-container {
            background-color: #111827;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            border: 1px solid #1f2937;
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: #3b82f6;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: #9ca3af;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 0.75rem;
            border-radius: 6px;
            border: 1px solid #374151;
            background-color: #1f2937;
            color: #fff;
            box-sizing: border-box;
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: #3b82f6;
        }

        .btn-submit {
            width: 100%;
            padding: 0.75rem;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background-color: #2563eb;
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .error-msg {
            color: #ef4444;
            background-color: rgba(239, 68, 68, 0.1);
            padding: 0.75rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            text-align: center;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .success-msg {
            color: #34d399;
            background-color: rgba(52, 211, 153, 0.1);
            padding: 0.75rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            text-align: center;
            border: 1px solid rgba(52, 211, 153, 0.2);
        }
    </style>
</head>

<body>

<div class="login-container">

    <h2>Vagalume90 Portal</h2>

    {% if erro %}
        <div class="error-msg">{{ erro }}</div>
    {% endif %}

    <div id="mensagem" role="status" aria-live="polite"></div>

    <form id="login-form">

        <div class="form-group">
            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                name="email"
                required
                autocomplete="username"
                placeholder="O teu email"
            >
        </div>

        <div class="form-group">
            <label for="password">Senha</label>

            <input
                type="password"
                id="password"
                name="password"
                required
                autocomplete="current-password"
                placeholder="A tua senha"
            >
        </div>

        <button type="submit" id="btn-entrar" class="btn-submit">
            Entrar no Ecossistema
        </button>

    </form>

</div>

<script>
    const CORE_URL = "https://vagalume90api.onrender.com";

    const formulario = document.getElementById("login-form");
    const mensagem = document.getElementById("mensagem");
    const botao = document.getElementById("btn-entrar");

    formulario.addEventListener("submit", async function(event) {
        event.preventDefault();

        mensagem.className = "";
        mensagem.textContent = "";

        botao.disabled = true;
        botao.textContent = "A verificar identidade...";

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        try {
            const resposta = await fetch(
                `${CORE_URL}/api/auth/login`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                }
            );

            const dados = await resposta.json();

            if (!resposta.ok) {
                throw new Error(
                    dados.message ||
                    dados.mensagem ||
                    dados.detail ||
                    "Email ou senha incorretos."
                );
            }

            mensagem.className = "success-msg";

            mensagem.textContent =
                "Credenciais verificadas com sucesso. " +
                "Identidade VG90: " +
                (dados.identity?.uid || dados.uid || "confirmada") +
                ". A integração da sessão ainda precisa de ser concluída.";

        } catch (erro) {
            mensagem.className = "error-msg";

            if (erro instanceof TypeError) {
                mensagem.textContent =
                    "Não foi possível contactar o Core VG90. " +
                    "Verifica a ligação e a configuração de CORS.";
            } else {
                mensagem.textContent = erro.message;
            }

        } finally {
            botao.disabled = false;
            botao.textContent = "Entrar no Ecossistema";
        }
    });
</script>

</body>
</html>
